name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # 백엔드 (루트 Express)
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Prettier check
        run: npm run format:check
        continue-on-error: true

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          SESSION_SECRET: test-secret-for-ci
          ANTHROPIC_API_KEY: dummy
          GEMINI_API_KEY: dummy

  # 프론트 (web/ Next.js) — 이식 후에도 CI가 백엔드만 돌고 있어 추가.
  # tsc·build 는 hard gate. lint 는 현재 clean 이라 같이 hard gate로 둔다.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
